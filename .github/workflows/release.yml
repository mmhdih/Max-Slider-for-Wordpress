name: Release

# Builds max-slider.zip and publishes it as a GitHub Release.
# Run it by pushing a tag (git tag v1.0.1 && git push origin v1.0.1)
# or manually from the Actions tab ("Run workflow").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: meta
        run: |
          VERSION=$(sed -n 's/^ \* Version:[[:space:]]*//p' max-slider/max-slider.php | tr -d '\r')
          STABLE=$(sed -n 's/^Stable tag:[[:space:]]*//p' max-slider/readme.txt | tr -d '\r')
          if [ "$VERSION" != "$STABLE" ]; then
            echo "::error::Version in max-slider.php ($VERSION) and Stable tag in readme.txt ($STABLE) differ"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin version v$VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check PHP syntax
        run: find max-slider -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          mkdir -p dist
          zip -r -X dist/max-slider.zip max-slider -x '*.DS_Store'
          unzip -l dist/max-slider.zip

      - name: Release notes
        run: |
          V="${{ steps.meta.outputs.version }}"
          {
            echo "## Max Slider $V"
            echo
            awk -v v="= $V =" '$0==v{f=1;next} /^= /{f=0} f' max-slider/readme.txt
            echo
            echo "### نصب / Installation"
            echo "1. فایل **max-slider.zip** را دانلود کنید. / Download **max-slider.zip** below."
            echo "2. پیشخوان وردپرس ← افزونه‌ها ← افزودن ← بارگذاری افزونه ← فعال‌سازی. / WordPress → Plugins → Add New → Upload Plugin → Activate."
            echo "3. اسلایدرها ← مدیریت اسلایدرها. / Sliders → Manage sliders."
            echo
            echo "راهنمای کامل با تصویر / Full guide: https://github.com/${GITHUB_REPOSITORY}#readme"
          } > dist/notes.md
          cat dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Max Slider ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          files: dist/max-slider.zip
          make_latest: true
